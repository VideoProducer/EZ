<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <!-- Viewport: viewport-fit=cover lets safe-area-inset-* CSS reach into the
             notch/punch-hole/gesture-bar on iPhone 14+/Pixel/Galaxy foldables.
             maximum-scale=5 keeps pinch-zoom (WCAG 1.4.4) while stopping iOS
             from auto-zooming when a form input gets focused. -->
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
        <!-- Chrome/Android tinted address bar + light-mode fallback. -->
        <meta name="theme-color" content="#0F2A5B" media="(prefers-color-scheme: dark)" />
        <meta name="theme-color" content="#FAF7F0" media="(prefers-color-scheme: light)" />
        <!-- Microsoft Edge / Windows tile + IE11 legacy fallback. -->
        <meta name="msapplication-TileColor" content="#0F2A5B" />
        <meta name="msapplication-navbutton-color" content="#0F2A5B" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <!-- Samsung Internet + KaiOS respect the standard PWA meta below. -->
        <meta name="mobile-web-app-capable" content="yes" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Sora:wght@800&family=Manrope:wght@600;700&family=Playfair+Display:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>EZtoFind.ca | BC Real Estate Search</title>
        <!-- Copyright & IP protection meta tags — help cease-and-desist letters + search engines identify ownership -->
        <meta name="copyright" content="© 2026 Doug LeMaire. All rights reserved. CIPO Copyright Registration No. 1247822."/>
        <meta name="author" content="Doug LeMaire, REALTOR®"/>
        <meta name="rights" content="EZtoFind.ca content, code, design, and Doogie AI character are proprietary works of Doug LeMaire, federally registered with the Canadian Intellectual Property Office (Reg. No. 1247822). See https://eztofind.ca/copyright"/>
        <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1"/>
        <meta name="googlebot" content="index, follow, max-image-preview:large"/>
        <!-- PWA manifest — allows users to install the site as an app on iOS/Android/desktop -->
        <link rel="manifest" href="/manifest.json"/>
        <link rel="icon" href="/favicon.ico" sizes="any"/>
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"/>
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
        <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png"/>
        <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png"/>
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
        <meta name="apple-mobile-web-app-capable" content="yes"/>
        <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
        <meta name="apple-mobile-web-app-title" content="EZtoFind"/>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="" defer></script>
        <meta name="description" content="AI-powered BC real estate research and lead generation platform. Doug LeMaire, REALTOR® — Greater Vancouver, Fraser Valley, Sea-to-Sky. BC-wide referral network."/>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
        <script src="https://assets.emergent.sh/scripts/emergent-main.js"></script>
        <!-- Ahrefs Web Analytics — first-party, cookieless, GDPR/PIPA-friendly.
             Provides referrer, traffic source, and page-visit signals that
             Ahrefs Site Audit + Rank Tracker consume back for the eztofind.ca
             property audit. Site key: ffNNxar7jQ7nxXaPcHLagw -->
        <script src="https://analytics.ahrefs.com/analytics.js" data-key="ffNNxar7jQ7nxXaPcHLagw" async></script>
    </head>
