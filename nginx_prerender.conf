# EZtoFind.ca — Nginx bot-prerender routing snippet
# --------------------------------------------------
# Drop into your production nginx server block (the one that serves the SPA).
# Assumes the FastAPI backend is reachable at http://backend:8001 (adjust).
#
# What it does
#   • Detects known LLM/search-engine crawlers by User-Agent.
#   • For those bots ONLY, rewrites the request to the prerender endpoint
#     /api/bot/{original path}, which returns fully-rendered HTML.
#   • All human traffic + blocklisted paths pass through to the SPA.
#
# Compliance
#   • BCFSA + CREA/GVR footers are in the rendered HTML (compliance_check enforced).
#   • PIPA:  /api, /admin, /favorites, /my-account etc. never hit the prerender path.
#   • No cloaking — same content served to humans and bots.
#
# Place this INSIDE `server { ... }` for eztofind.ca.

# 1) Bot User-Agent detection
map $http_user_agent $is_bot {
    default 0;
    "~*(googlebot|google-inspectiontool|google-extended|bingbot|slurp)" 1;
    "~*(duckduckbot|baiduspider|yandexbot|sogou|exabot|facebot)"        1;
    "~*(gptbot|oai-searchbot|chatgpt-user|claudebot|claude-web|anthropic-ai)" 1;
    "~*(perplexitybot|perplexity-user)"                                 1;
    "~*(ccbot|amazonbot|applebot|bytespider|meta-externalagent)"        1;
    "~*(facebookexternalhit|twitterbot|linkedinbot|slackbot|telegrambot)" 1;
    "~*(discordbot|whatsapp|pinterestbot|redditbot)"                    1;
    "~*(mj12bot|semrushbot|ahrefsbot|dotbot|petalbot)"                  1;
}

# 2) PIPA blocklist — these paths are NEVER prerendered even for bots
map $uri $is_blocklisted {
    default 0;
    "~^/api(/|$)"                     1;
    "~^/admin(/|$)"                   1;
    "~^/my-account(/|$)"              1;
    "~^/account(/|$)"                 1;
    "~^/favorites(/|$)"               1;
    "~^/dashboard(/|$)"               1;
    "~^/(login|signup|signin|logout|auth)(/|$)" 1;
    "~^/consultation-?status(/|$)"    1;
    "~^/doogie/upload(/|$)"           1;
    "~^/(uploads|download|snapshot|static|assets)(/|$)" 1;
}

# 3) Combined route decision (only when bot AND not blocklisted)
map "$is_bot:$is_blocklisted" $prerender {
    default 0;
    "1:0"   1;
}

server {
    listen 443 ssl http2;
    server_name eztofind.ca www.eztofind.ca;

    # ... your existing ssl_certificate, root, etc.

    location / {
        if ($prerender) {
            # Rewrite to the bot prerender endpoint and hand off to the backend.
            rewrite ^(.*)$ /api/bot$1 last;
        }
        # Human traffic → SPA
        try_files $uri /index.html;
    }

    # Backend prerender endpoint (never cached at nginx layer — the backend
    # already caches in Mongo TTL).
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent $http_user_agent;
        proxy_read_timeout 30s;
    }
}
