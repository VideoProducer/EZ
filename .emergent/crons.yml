crons:
  - name: sunday-digest
    description: "Emails opted-in savers their weekly new-match + price-drop brief every Sunday 6pm PT"
    cron: "0 18 * * 0"
    timezone: "America/Vancouver"
    endpoint: "{{BASE_URL}}/api/cron/sunday-night-digest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true

  - name: sitemap-indexnow
    description: "Nightly sitemap.xml + feed.xml regen and IndexNow ping so new MLS listings & pages get indexed fast"
    cron: "0 3 * * *"
    timezone: "America/Vancouver"
    endpoint: "{{BASE_URL}}/api/cron/sitemap-indexnow"
    method: POST
    # Acks immediately; backgrounds sitemap regen + IndexNow push.
    enabled: true

  - name: saved-search-alerts
    description: "Cadence-aware (instant/daily/weekly) new-match email alerts for verified saved searches"
    cron: "0 * * * *"
    timezone: "America/Vancouver"
    endpoint: "{{BASE_URL}}/api/cron/saved-search-alerts"
    method: POST
    # Runs hourly; each search fires only when its cadence window has elapsed.
    enabled: true
